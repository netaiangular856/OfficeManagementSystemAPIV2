<div class="notification-container rounded-4" [class.rtl]="isRTL">
  <!-- Notification Bell Button -->
  <button 
    class="notification-bell" 
    [class.shake]="isBellShaking()"
    (click)="toggleDropdown()"
    [attr.aria-label]="translate('notifications.toggle_notifications')"
    [attr.aria-expanded]="isOpen()">
    
    <!-- Bell Icon -->
    <svg 
      class="bell-icon" 
      width="13" 
      height="13" 
      viewBox="0 0 24 24" 
      fill="none" 
      stroke="currentColor" 
      stroke-width="2">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    
    <!-- Unread Badge -->
    <span 
      class="unread-badge" 
      *ngIf="unreadCount() > 0"
      [class.rtl]="isRTL">
      {{ unreadCount() > 99 ? '99+' : unreadCount() }}
    </span>
  </button>

  <!-- Backdrop for Mobile -->
  <div 
    class="notification-backdrop" 
    [class.open]="isOpen()"
    (click)="closeDropdown()"
    *ngIf="isOpen()">
  </div>

  <!-- Notification Dropdown -->
  <div 
    class="notification-dropdown" 
    [class.open]="isOpen()"
    [class.rtl]="isRTL"
    (click)="$event.stopPropagation()">
    
    <!-- Header -->
    <div class="dropdown-header">
      <h3 class="header-title">{{ translate('notifications.notifications') }}</h3>
      <button 
        class="mark-all-read-btn"
        (click)="markAllAsRead()"
        *ngIf="unreadCount() > 0">
        {{ translate('notifications.mark_all_read') }}
      </button>
    </div>

    <!-- Error Message -->
    <div *ngIf="error()" class="error-message">
      <svg class="error-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
      {{ error() }}
    </div>

    <!-- Notifications List -->
    <div class="notifications-list">
      <!-- Loading State -->
      <div *ngIf="isLoading()" class="loading-state">
        <svg class="loading-spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke-dasharray="31.416" stroke-dashoffset="31.416">
            <animate attributeName="stroke-dasharray" dur="2s" values="0 31.416;15.708 15.708;0 31.416" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" dur="2s" values="0;-15.708;-31.416" repeatCount="indefinite"/>
          </circle>
        </svg>
        <p class="loading-text">{{ translate('common.loading') }}</p>
      </div>

      <!-- Notifications -->
      <div 
        *ngFor="let notification of notifications"
        class="notification-item"
        [class.unread]="!notification.isRead"
        [class.read]="notification.isRead"
        [class.rtl]="isRTL">
        
        <!-- Notification Icon -->
        <!-- <div class="notification-icon" [class]="getNotificationClass(notification.type || 'info')">
          <span class="icon-text">{{ getNotificationIcon(notification.type || 'info') }}</span>
        </div> -->
        
        <!-- Notification Content -->
        <div class="notification-content">
          <h4 class="notification-title">{{ notification.title }}</h4>
          <p class="notification-message">{{ notification.message }}</p>
          <span class="notification-time">{{ getTimeAgo(notification.timestamp) }}</span>
        </div>
        
        <!-- Action Buttons -->
        <div class="notification-actions">

          
          <!-- Mark as Read Button -->
          <button 
            *ngIf="!notification.isRead"
            class="mark-read-btn"
            (click)="markAsRead(notification.id)"
            [attr.aria-label]="translate('notifications.mark_as_read')">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20,6 9,17 4,12"></polyline>
            </svg>
          </button>

          <!--  Details Button -->
          <button 
          *ngIf="canNavigateToReference(notification)"
          class="view-details-btn"
          (click)="navigateToReference(notification)"
          [attr.aria-label]="translate('notifications.view_details')">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
        </div>
      </div>
      
      <!-- Empty State -->
      <div *ngIf="!isLoading() && notifications.length === 0" class="empty-state">
        <svg class="empty-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <p class="empty-text">{{ translate('notifications.no_notifications') }}</p>
      </div>
    </div>

  
  </div>
</div>
