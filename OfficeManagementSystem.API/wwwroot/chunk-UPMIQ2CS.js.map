<div 
  class="modal-overlay" 
  [class.open]="isOpen"
  [class.rtl]="isRTL"
  (click)="onBackdropClick($event)">
  
  <div class="modal-container" [class.rtl]="isRTL">
    <!-- Modal Header -->
    <div class="modal-header">
      <h2 class="modal-title">{{ translate('notifications.send_new_notification') }}</h2>
      <button 
        class="close-btn"
        (click)="onClose()"
        [attr.aria-label]="translate('common.close')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <!-- Error Message -->
      <div *ngIf="error()" class="error-message">
        <svg class="error-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        {{ error() }}
      </div>

      <form (ngSubmit)="onSubmit()" class="notification-form">
        <!-- Title Field -->
        <div class="form-group">
          <label for="notification-title" class="form-label">
            {{ translate('notifications.title') }} *
          </label>
          <input
            id="notification-title"
            type="text"
            [(ngModel)]="form().title"
            name="title"
            class="form-input"
            [placeholder]="translate('notifications.title_placeholder')"
            required>
        </div>

        <!-- Message Field -->
        <div class="form-group">
          <label for="notification-message" class="form-label">
            {{ translate('notifications.message') }} *
          </label>
          <textarea
            id="notification-message"
            [(ngModel)]="form().message"
            name="message"
            class="form-textarea"
            [placeholder]="translate('notifications.message_placeholder')"
            rows="4"
            required></textarea>
        </div>

        <!-- User Selection Section -->
        <div class="form-group">
          <label class="form-label">
            {{ translate('notifications.select_users') }} *
          </label>
          
          <!-- Selected Users Display -->
          <div class="selected-users" *ngIf="getSelectedUsersCount() > 0">
            <div 
              *ngFor="let userId of form().selectedUsers"
              class="selected-user-tag">
              <span class="user-name">{{ getSelectedUsersNames()[form().selectedUsers.indexOf(userId)] }}</span>
              <button 
                type="button"
                class="remove-user-btn"
                (click)="removeUser(userId)"
                [attr.aria-label]="translate('notifications.remove_user')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- User Search -->
          <div class="user-search">
            <div class="search-input-wrapper">
              <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="M21 21l-4.35-4.35"></path>
              </svg>
              <input
                type="text"
                [ngModel]="searchTerm()"
                (ngModelChange)="onSearchChange($event)"
                [ngModelOptions]="{standalone: true}"
                class="search-input"
                [placeholder]="translate('notifications.search_users_placeholder')">
            </div>
          </div>

          <!-- Users List -->
          <div class="users-list">
            <!-- Loading State -->
            <div *ngIf="isLoading()" class="loading-state">
              <svg class="loading-spinner" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" stroke-dasharray="31.416" stroke-dashoffset="31.416">
                  <animate attributeName="stroke-dasharray" dur="2s" values="0 31.416;15.708 15.708;0 31.416" repeatCount="indefinite"/>
                  <animate attributeName="stroke-dashoffset" dur="2s" values="0;-15.708;-31.416" repeatCount="indefinite"/>
                </circle>
              </svg>
              <p class="loading-text">{{ translate('common.loading') }}</p>
            </div>

            <!-- Users List -->
            <div 
              *ngFor="let user of filteredUsers()"
              class="user-item"
              [class.selected]="isUserSelected(user.id)"
              (click)="toggleUserSelection(user.id)">
              
              <!-- User Avatar -->
              <div class="user-avatar">
                <span class="avatar-text">{{ getUserInitials(user.name) }}</span>
              </div>
              
              <!-- User Info -->
              <div class="user-info">
                <div class="user-name">{{ user.name }}</div>
                <div class="user-department" *ngIf="user.departmentName">{{ user.departmentName }}</div>
              </div>
              
              <!-- Selection Indicator -->
              <div class="selection-indicator">
                <svg 
                  *ngIf="isUserSelected(user.id)"
                  class="check-icon" 
                  width="20" 
                  height="20" 
                  viewBox="0 0 24 24" 
                  fill="none" 
                  stroke="currentColor" 
                  stroke-width="2">
                  <polyline points="20,6 9,17 4,12"></polyline>
                </svg>
              </div>
            </div>
            
            <!-- Empty State -->
            <div *ngIf="!isLoading() && filteredUsers().length === 0" class="empty-users">
              <svg class="empty-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 1 0 7.75"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              <p class="empty-text">{{ translate('notifications.no_users_found') }}</p>
            </div>
          </div>
        </div>
      </form>
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <button 
        type="submit"
        class="btn btn-primary"
        [disabled]="!isFormValid() || isLoading()"
        (click)="onSubmit()">
        <svg *ngIf="!isLoading()" class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13"></path>
          <polygon points="22,2 15,22 11,13 2,9 22,2"></polygon>
        </svg>
        <svg *ngIf="isLoading()" class="loading-spinner-small" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke-dasharray="31.416" stroke-dashoffset="31.416">
            <animate attributeName="stroke-dasharray" dur="2s" values="0 31.416;15.708 15.708;0 31.416" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" dur="2s" values="0;-15.708;-31.416" repeatCount="indefinite"/>
          </circle>
        </svg>
        {{ isLoading() ? translate('common.sending') : translate('notifications.send_notification') }}
      </button>
      <button 
        type="button"
        class="btn btn-secondary"
        (click)="onClose()"
        [disabled]="isLoading()">
        {{ translate('common.cancel') }}
      </button>
      
    </div>
  </div>
</div>
