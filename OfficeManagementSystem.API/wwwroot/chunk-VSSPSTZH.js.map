<div class="notifications-page rounded-5" [class.rtl]="isRTL">
   <!-- Header -->
   <div class="page-header">
    <h1 class="page-title">{{ translate("notifications.pageTitle") }}</h1>

    <div class="header-actions">
      <!-- Send Notification Button -->
      <button class="send-notification-btn" (click)="openNotificationModal()">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M22 2L11 13"></path>
          <polygon points="22,2 15,22 11,13 2,9 22,2"></polygon>
        </svg>
        {{ translate("notifications.send_notification_btn") }}
      </button>

      <!-- Search Bar -->
      <div class="search-container">
      <input
        type="text"
        class="search-input"
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
        [placeholder]="translate('notifications.searchPlaceholder')"
      />
      <button class="search-btn" (click)="onSearch()">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
      </button>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-container">
    <div class="spinner"></div>
    <p>{{ translate("common.loading") }}</p>
  </div>

  <!-- Notifications List -->
  <div
    *ngIf="!isLoading && notifications.length > 0"
    class="notifications-grid"
  >
    <div
      *ngFor="let notification of notifications"
      class="notification-card"
      [class.unread]="!notification.isRead"
      [class.rtl]="isRTL"
    >
      <!-- Content -->
      <div class="notification-content">
        <div class="notification-header">
          <h3 class="notification-title">{{ notification.title }}</h3>
          <div class="notification-actions">
            <button
              *ngIf="canNavigateToReference(notification)"
              class="action-btn view-btn"
              (click)="navigateToReference(notification)"
              [title]="translate('notifications.view_details')"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>

            <button
              *ngIf="!notification.isRead"
              class="action-btn read-btn"
              (click)="markAsRead(notification)"
              [title]="translate('notifications.mark_as_read')"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="20,6 9,17 4,12"></polyline>
              </svg>
            </button>
          </div>
        </div>
        <p class="notification-message">{{ notification.message }}</p>
        <span class="notification-time">{{
          formatDate(notification.createdAt)
        }}</span>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && notifications.length === 0" class="empty-state">
    <svg
      width="64"
      height="64"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1"
    >
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    <p>{{ translate("notifications.no_notifications") }}</p>
  </div>

  <!-- Pagination -->
  <div *ngIf="!isLoading && totalPages > 1" class="pagination">
    <button
      class="page-btn"
      [disabled]="currentPage === 1"
      (click)="onPageChange(currentPage - 1)"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <polyline
          [attr.points]="isRTL ? '9,18 15,12 9,6' : '15,18 9,12 15,6'"
        ></polyline>
      </svg>
    </button>

    <button
      *ngFor="let page of getVisiblePages()"
      class="page-btn"
      [class.active]="page === currentPage"
      (click)="onPageChange(page)"
    >
      {{ page }}
    </button>

    <button
      class="page-btn"
      [disabled]="currentPage === totalPages"
      (click)="onPageChange(currentPage + 1)"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <polyline
          [attr.points]="isRTL ? '15,18 9,12 15,6' : '9,18 15,12 9,6'"
        ></polyline>
      </svg>
    </button>
  </div>

  <!-- Send Notification Modal -->
  <app-add-notification-modal
    [isRTL]="isRTL"
    [isOpen]="showNotificationModal"
    (closeModal)="closeNotificationModal()"
    (sendNotification)="onSendNotification($event)">
  </app-add-notification-modal>
</div>
