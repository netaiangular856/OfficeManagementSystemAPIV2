<div class="app-layout custom-scrollbar" [class.rtl]="isRTL()">
  <app-sidebar 
    [rtl]="isRTL()" 
    [isMobile]="isMobile()"
    [mobileOpen]="mobileSidebarOpen()"
    (collapsedChange)="onSidebarCollapsed($event)"
    (logoutConfirmRequested)="onLogoutConfirmRequested()"
    (notificationModalRequested)="openNotificationModal()"
    (mobileSidebarClose)="closeMobileSidebar()">
  </app-sidebar>
  
  <div class="content-area" [class.sidebar-collapsed]="sidebarCollapsed()">
    <header class="app-header" [class.rtl]="isRTL()">
      <div class="header-content">
        <!-- Mobile Sidebar Toggle Button -->
        <button 
          *ngIf="isMobile()"
          class="mobile-sidebar-toggle"
          (click)="toggleMobileSidebar()"
          [attr.aria-expanded]="mobileSidebarOpen()"
          [attr.aria-label]="mobileSidebarOpen() ? 'Close sidebar' : 'Open sidebar'">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        
        <div class="header-actions" [class.rtl]="isRTL()">
          <div class="language-toggle">
            <button
              class="lang-toggle"
              (click)="toggleLanguage()"
              [attr.aria-label]="currentLang() === 'en' ? 'Switch to Arabic' : 'Switch to English'">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
              </span>
              <span class="label">{{ currentLang() === 'en' ? 'ع' : 'EN' }}</span>
              <span class="pulse"></span>
            </button>
          </div>
          <!-- Profile Button -->
          <div 
            class="profile-toggle" 
            #profileMenuContainer
            [class.menu-open]="showProfileMenu()"
            [class.rtl]="isRTL()">
            <button
              type="button"
              class="profile-btn"
              (click)="toggleProfileMenu($event)"
              [attr.id]="profileMenuId + '-trigger'"
              [attr.aria-controls]="profileMenuId"
              aria-haspopup="menu"
              [attr.aria-expanded]="showProfileMenu()"
              [attr.aria-label]="translate('login.profile')">
              <span class="profile-chip">
                <span class="profile-avatar">
                  <img 
                    [src]="getUserImageUrl()" 
                    [alt]="getUserFullName()" 
                    class="profile-avatar__img"
                    (error)="onAvatarError($event)">
                </span>
              </span>
              <span class="profile-meta">
                <span class="profile-meta__name">
                  {{ getUserFullName() }}
                </span>
                <span class="profile-meta__email" *ngIf="user?.email">{{ user?.email }}</span>
              </span>
              <span class="profile-chevron" [class.open]="showProfileMenu()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </span>
              <span class="pulse"></span>
            </button>

            <div 
              class="profile-menu" 
              *ngIf="showProfileMenu()" 
              role="menu"
              [attr.id]="profileMenuId"
              [attr.aria-label]="translate('login.profile')"
              [class.rtl]="isRTL()">
              <div class="profile-menu__header">
                <div class="profile-menu__avatar">
                  <img 
                    [src]="getUserImageUrl()" 
                    [alt]="getUserFullName()" 
                    class="profile-menu__avatar-img"
                    (error)="onAvatarError($event)">
                </div>
                <div class="profile-menu__info">
                  <span class="profile-menu__name">
                    {{ getUserFullName() }}
                  </span>
                  <span class="profile-menu__email" *ngIf="user?.email">{{ user?.email }}</span>
                </div>
              </div>
              <div class="profile-menu__actions">
                <button 
                  type="button" 
                  class="profile-menu__item"
                  role="menuitem"
                  (click)="onProfileMenuSelect('profile')">
                  <span class="profile-menu__icon profile-menu__icon--primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                  </span>
                  <span class="profile-menu__text">
                    <span class="profile-menu__title">{{ translate('login.profile') }}</span>
                  </span>
                </button>
                <button 
                  type="button" 
                  class="profile-menu__item profile-menu__item--danger"
                  role="menuitem"
                  (click)="onProfileMenuSelect('logout')">
                  <span class="profile-menu__icon profile-menu__icon--danger">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                      <polyline points="16,17 21,12 16,7"></polyline>
                      <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                  </span>
                  <span class="profile-menu__text">
                    <span class="profile-menu__title">{{ translate('login.logout') }}</span>
                  </span>
                </button>
              </div>
            </div>
          </div>
          <!-- Notification Dropdown -->
          <app-notification-dropdown 
            [isRTL]="isRTL()"
            class="header-notification-dropdown">
          </app-notification-dropdown>
        </div>
      </div>
    </header>
    
    <main class="main-content custom-scrollbar">
      <router-outlet></router-outlet>
    </main>
  </div>
  
  <!-- Mobile Sidebar Overlay -->
  <div 
    *ngIf="isMobile() && mobileSidebarOpen()"
    class="mobile-sidebar-overlay"
    (click)="closeMobileSidebar()">
  </div>
</div>

<!-- Logout Confirmation Modal - Outside sidebar for proper overlay -->
<div class="logout-confirm-overlay" *ngIf="showLogoutConfirm()" (click)="closeLogoutConfirm()">
  <div class="logout-confirm-modal" (click)="$event.stopPropagation()">
    <div class="logout-confirm-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16,17 21,12 16,7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </div>
    <h3 class="logout-confirm-title">{{ translate('sidebar.logout_confirmation') }}</h3>
    <p class="logout-confirm-message">{{ translate('sidebar.logout_confirm_message') }}</p>
    <div class="logout-confirm-actions">
      <button class="btn btn-cancel" (click)="closeLogoutConfirm()">
        {{ translate('common.cancel') }}
      </button>
      <button class="btn btn-logout" (click)="logout()">
        {{ translate('sidebar.logout') }}
      </button>
    </div>
  </div>
</div>

<!-- Add Notification Modal - Outside sidebar for proper overlay -->
<app-add-notification-modal
  [isRTL]="isRTL()"
  [isOpen]="showNotificationModal()"
  (closeModal)="closeNotificationModal()"
  (sendNotification)="onSendNotification($event)">
</app-add-notification-modal>
