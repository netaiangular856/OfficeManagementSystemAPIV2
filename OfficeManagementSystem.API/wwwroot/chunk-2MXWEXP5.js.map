<div class="reset-password-layout" [dir]="isRTL() ? 'rtl' : 'ltr'">
  <!-- Top Header with Logo and Language Toggle -->
  <div class="top-header">
    <div class="top-logo">
      
    </div>
    <div class="language-toggle">
      <button
        class="lang-toggle"
        (click)="toggleLanguage()"
        [attr.aria-label]="isRTL() ? 'Switch to English' : 'Switch to Arabic'">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </span>
        <span class="label fw-bold">{{ isRTL() ? 'EN' : 'ع' }}</span>
        <span class="pulse"></span>
      </button>
    </div>
  </div>

  <!-- Reset Password Form Section -->
  <div class="reset-password-form">
    <!-- Welcome text block aligned to form card edges -->
    <div class="welcome-block">
      <h1 class="welcome-title">{{ translate('reset_password.title') }}</h1>
      <p class="welcome-subtitle">{{ translate('reset_password.subtitle') }}</p>
    </div>

    <div class="form-container">
      <div class="form-title">
        <h2>{{ translate('reset_password.title') }}</h2>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-password-form-content">
        <div class="form-group">
          <label [for]="'newPassword'" class="form-label">{{ translate('reset_password.new_password') }}</label>
          <div class="password-input-container">
            <input
              [type]="showNewPassword ? 'text' : 'password'"
              id="newPassword"
              formControlName="newPassword"
              class="form-control"
              [class.error]="getFieldError('newPassword')"
              [placeholder]="translate('reset_password.new_password')"
            >
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility('newPassword')"
              [attr.aria-label]="showNewPassword ? translate('login.hide') : translate('login.show')"
            >
              <span class="toggle-text">{{ showNewPassword ? translate('login.hide') : translate('login.show') }}</span>
              <i class="toggle-icon" [class]="showNewPassword ? 'eye-off' : 'eye'"></i>
            </button>
          </div>
          <div class="form-error" *ngIf="getFieldError('newPassword')">
            {{ getFieldError('newPassword') }}
          </div>
        </div>

        <div class="form-group">
          <label [for]="'confirmPassword'" class="form-label">{{ translate('reset_password.confirm_new_password') }}</label>
          <div class="password-input-container">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              formControlName="confirmPassword"
              class="form-control"
              [class.error]="getFieldError('confirmPassword')"
              [placeholder]="translate('reset_password.confirm_new_password')"
            >
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility('confirmPassword')"
              [attr.aria-label]="showConfirmPassword ? translate('login.hide') : translate('login.show')"
            >
              <span class="toggle-text">{{ showConfirmPassword ? translate('login.hide') : translate('login.show') }}</span>
              <i class="toggle-icon" [class]="showConfirmPassword ? 'eye-off' : 'eye'"></i>
            </button>
          </div>
          <div class="form-error" *ngIf="getFieldError('confirmPassword')">
            {{ getFieldError('confirmPassword') }}
          </div>
        </div>

        <div class="form-actions">
          <button
            type="submit"
            class="btn btn-primary reset-btn"
            [disabled]="loading || !token || !email"
          >
            <span *ngIf="!loading">{{ translate('reset_password.reset_button') }}</span>
            <span *ngIf="loading">{{ translate('login.loading') }}</span>
          </button>
        </div>

        <div class="form-footer">
          <a (click)="goToLogin()" class="back-to-login-link">
            {{ translate('reset_password.back_to_login') }}
          </a>
        </div>

        <div class="success-message" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
      </form>
    </div>
  </div>

</div>
