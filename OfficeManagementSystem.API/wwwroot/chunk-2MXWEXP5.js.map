<div class="login-layout" [dir]="isRTL() ? 'rtl' : 'ltr'">
  <!-- Top Header with Logo and Language Toggle -->
  <div class="top-header">
    <div class="top-logo">
    </div>
    <div class="language-toggle">
      <button
        class="lang-toggle"
        (click)="toggleLanguage()"
        [attr.aria-label]="isRTL() ? 'Switch to English' : 'Switch to Arabic'">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </span>
        <span class="label fw-bold">{{ isRTL() ? 'EN' : 'ع' }}</span>
        <span class="pulse"></span>
      </button>
    </div>
  </div>



  <!-- Login Form Section -->
  <div class="login-form">
    <!-- Welcome text block aligned to form card edges -->
    <div class="welcome-block">
      <h1 class="welcome-title">{{ translate('login.welcome_back') }}</h1>
      <p class="welcome-subtitle">{{ translate('login.login_hint') }}</p>
    </div>
    
    <div class="form-container">
      <div class="form-title">
        <h2>{{ translate('login.login') }}</h2>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form-content">
        <div class="form-group">
          <label [for]="'email'" class="form-label">{{ translate('login.email') }}</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="form-control"
            [class.error]="getFieldError('email')"
            [placeholder]="translate('login.email')"
          >
          <div class="form-error" *ngIf="getFieldError('email')">
            {{ getFieldError('email') }}
          </div>
        </div>

        <div class="form-group">
          <label [for]="'password'" class="form-label">{{ translate('login.password') }}</label>
          <div class="password-input-container">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              class="form-control"
              [class.error]="getFieldError('password')"
              [placeholder]="translate('login.password')"
            >
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? translate('login.hide') : translate('login.show')"
            >
              <!-- Eye icon for show password - direction changes with language -->
              <svg *ngIf="!showPassword" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Eye-off icon for hide password - direction changes with language -->
              <svg *ngIf="showPassword" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.749 9.749 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            </button>
          </div>
          <div class="form-error" *ngIf="getFieldError('password')">
            {{ getFieldError('password') }}
          </div>
        </div>

        <div class="form-actions">
          <button
            type="submit"
            class="btn btn-primary login-btn"
            [disabled]="loading"
          >
            <span *ngIf="!loading">{{ translate('login.login') }}</span>
            <span *ngIf="loading">{{ translate('login.loading') }}</span>
          </button>
        </div>

        <div class="form-footer">
          <a routerLink="/auth/request-reset" class="forgot-password-link">
            {{ translate('login.forgot_password') }}
          </a>
        </div>

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
      </form>
    </div>
  </div>
    <!-- Side Section (Hero) -->
    <div class="login-side">
        <div class="side-overlay">
          <div class="side-content">
            <h1 class="side-title">{{ translate('login.system_title') }}</h1>
            <!-- <h1 class="side-title">{{ translate('login.paperless_slogan_title') }}</h1>
            <p class="side-subtitle">{{ translate('login.paperless_slogan') }}</p> -->
          </div>
        </div>
        <div class="brand">
          <img src="/logo.png" alt="FeaOffice" class="brand-mark">
        </div>
      </div>
</div>
