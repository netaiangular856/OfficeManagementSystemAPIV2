<div class="request-reset-layout" [dir]="isRTL() ? 'rtl' : 'ltr'">
  <!-- Top Header with Logo and Language Toggle -->
  <div class="top-header">
    <div class="top-logo">
      
    </div>
    <div class="language-toggle">
      <button
        class="lang-toggle"
        (click)="toggleLanguage()"
        [attr.aria-label]="isRTL() ? 'Switch to English' : 'Switch to Arabic'">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </span>
        <span class="label fw-bold">{{ isRTL() ? 'EN' : 'ع' }}</span>
        <span class="pulse"></span>
      </button>
    </div>
  </div>

  <!-- Request Reset Form Section -->
  <div class="request-reset-form">
    <!-- Welcome text block aligned to form card edges -->
    <div class="welcome-block">
      <h1 class="welcome-title">{{ translate('request_reset.title') }}</h1>
      <p class="welcome-subtitle">{{ translate('request_reset.subtitle') }}</p>
    </div>

    <div class="form-container">
      <div class="form-title">
        <h2>{{ translate('request_reset.title') }}</h2>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="request-reset-form-content">
        <div class="form-group">
          <label [for]="'email'" class="form-label">{{ translate('request_reset.email') }}</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="form-control"
            [class.error]="getFieldError('email')"
            [placeholder]="translate('request_reset.email')"
          >
          <div class="form-error" *ngIf="getFieldError('email')">
            {{ getFieldError('email') }}
          </div>
        </div>

        <div class="form-actions">
          <button
            type="submit"
            class="btn btn-primary reset-btn"
            [disabled]="loading"
          >
            <span *ngIf="!loading">{{ translate('request_reset.send_button') }}</span>
            <span *ngIf="loading">{{ translate('login.loading') }}</span>
          </button>
        </div>

        <div class="form-footer">
          <a (click)="goToLogin()" class="back-to-login-link">
            {{ translate('request_reset.back_to_login') }}
          </a>
        </div>

        <div class="success-message" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
      </form>
    </div>
  </div>


</div>
