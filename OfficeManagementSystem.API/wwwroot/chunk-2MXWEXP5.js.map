<div class="change-password-container" [dir]="isRTL() ? 'rtl' : 'ltr'">
  <!-- Language Toggle -->
  <div class="language-toggle">
    <button
      class="lang-toggle"
      (click)="toggleLanguage()"
      [attr.aria-label]="isRTL() ? 'Switch to English' : 'Switch to Arabic'">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </span>
      <span class="label fw-bold">{{ isRTL() ? 'EN' : 'ع' }}</span>
      <span class="pulse"></span>
    </button>
  </div>

  <!-- Form Section -->
  <div class="form-section">
    <div class="form-container">
      <div class="form-header">
        <h1 class="title">{{ translate('login.change_password') }}</h1>
        <p class="subtitle">{{ translate('login.changepass_hint') }}</p>
      </div>

      <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="change-password-form">
        <div class="form-group">
          <label [for]="'currentPassword'" class="form-label">{{ translate('login.current_password') }}</label>
          <div class="password-input-container">
            <input
              [type]="showCurrentPassword ? 'text' : 'password'"
              id="currentPassword"
              formControlName="currentPassword"
              class="form-control"
              [class.error]="getFieldError('currentPassword')"
              [placeholder]="translate('login.current_password')"
            >
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility('currentPassword')"
              [attr.aria-label]="showCurrentPassword ? translate('login.hide') : translate('login.show')"
            >
              <svg *ngIf="!showCurrentPassword" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showCurrentPassword" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.749 9.749 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            </button>
          </div>
          <div class="form-error" *ngIf="getFieldError('currentPassword')">
            {{ getFieldError('currentPassword') }}
          </div>
        </div>

        <div class="form-group">
          <label [for]="'newPassword'" class="form-label">{{ translate('login.new_password') }}</label>
          <div class="password-input-container">
            <input
              [type]="showNewPassword ? 'text' : 'password'"
              id="newPassword"
              formControlName="newPassword"
              class="form-control"
              [class.error]="getFieldError('newPassword')"
              [placeholder]="translate('login.new_password')"
            >
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility('newPassword')"
              [attr.aria-label]="showNewPassword ? translate('login.hide') : translate('login.show')"
            >
              <svg *ngIf="!showNewPassword" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showNewPassword" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.749 9.749 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            </button>
          </div>
          <div class="form-error" *ngIf="getFieldError('newPassword')">
            {{ getFieldError('newPassword') }}
          </div>
        </div>

        <div class="form-group">
          <label [for]="'confirmNewPassword'" class="form-label">{{ translate('login.confirm_new_password') }}</label>
          <div class="password-input-container">
            <input
              [type]="showconfirmNewPassword ? 'text' : 'password'"
              id="confirmNewPassword"
              formControlName="confirmNewPassword"
              class="form-control"
              [class.error]="getFieldError('confirmNewPassword')"
              [placeholder]="translate('login.confirm_new_password')"
            >
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility('confirmNewPassword')"
              [attr.aria-label]="showconfirmNewPassword ? translate('login.hide') : translate('login.show')"
            >
              <svg *ngIf="!showconfirmNewPassword" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showconfirmNewPassword" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.749 9.749 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            </button>
          </div>
          <div class="form-error" *ngIf="getFieldError('confirmNewPassword')">
            {{ getFieldError('confirmNewPassword') }}
          </div>
        </div>

        <div class="form-actions">
          <button
            type="submit"
            class="btn btn-primary change-btn"
            [disabled]="loading"
          >
            <span *ngIf="!loading">{{ translate('login.change_password') }}</span>
            <span *ngIf="loading">{{ translate('login.loading') }}</span>
          </button>
        </div>

        <div class="form-footer">
          <a (click)="goBack()" class="back-link">
            {{ translate('login.profile') }}
          </a>
        </div>

        <div class="success-message" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
      </form>
    </div>
  </div>
</div>
